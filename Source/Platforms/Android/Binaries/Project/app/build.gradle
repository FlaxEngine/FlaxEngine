apply plugin: 'com.android.application'
android {
    compileSdk ${TargetSdk}
    namespace "${PackageName}"
    defaultConfig {
        applicationId "${PackageName}"
        minSdk ${MinimumSdk}
        targetSdk ${TargetSdk}
        versionCode ${VersionCode}
        versionName "${ProjectVersion}"
        ndk {
            abiFilter "${PackageAbi}"
        }
    }
    sourceSets {
        main {
            jni.srcDirs = []
            jniLibs.srcDirs = ['jniLibs']
            assets.srcDirs = ['assets']
        }
    } 
    buildTypes {
        release {
            debuggable true
            minifyEnabled false
        }
    }
    packagingOptions {
        doNotStrip '**.so'
    }
    androidResources {
        // Disable compression for content files to allow AAsset_openFileDescriptor to work
        noCompress 'flax', 'flaxpac'
    }
}
dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
}
